<template>
  <style>
    #s2 { position: absolute; inset: 0; }
    #s2-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  <div id="s2" data-composition-id="s2" data-width="1920" data-height="1080">
    <canvas id="s2-cv" width="1920" height="1080"></canvas>
  </div>
  <script>
    (function () {
      const { E, tween, kf, seg, clamp, txt, txtIn, img, IMG } = MH;
      const D = window.DNA, B = D.B, DUR = 4;
      const { ctx, W, H } = MH.stage("s2-cv");
      const COL = (W - 2 * 96 - 11 * 24) / 12, cx = (i) => 96 + i * (COL + 24);
      function draw(t) {
        MH.clear(ctx, D.bg);
        for (let i = 0; i <= 12; i++) { ctx.fillStyle = D.grid; ctx.fillRect(i === 12 ? W - 96 : cx(i) - 12, 0, 1, H); }
        const n = kf(t, [[0, 0], [B(0.5), 0.25, E.snap], [B(1), 0.5, E.snap], [B(1.5), 0.75, E.snap], [B(2), 1, E.snap]]);
        ctx.save(); ctx.beginPath(); ctx.rect(66, 0, cx(6) - 66, 990); ctx.clip();
        txt(ctx, "1", 66, 990 + (1 - n) * 720, { size: 900, weight: 800, color: D.ink, tracking: -40 }); ctx.restore();
        txtIn(ctx, "눈으로 본다", 96, 190, seg(t, B(1.5), B(2.5)), { size: 76, weight: 700, color: D.ink });
        const x = cx(7), w = cx(12) - x, p = tween(t, B(1.5), B(1), E.snap);
        ctx.fillStyle = D.paper; ctx.fillRect(x, 130, w, 860 * p);
        if (IMG.front) { ctx.save(); ctx.beginPath(); ctx.rect(x, 130, w, 860 * p); ctx.clip(); img(ctx, "front", x + w / 2, 570, w - 80, 760); ctx.restore(); }
      }
      const tl = gsap.timeline({ paused: true });
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["s2-images"] = MH.load({ front: { src: "assets/source/robot-front.jpg", cutout: true, tol: 14 } }).then(() => draw(tl.time()));
      MH.drive(tl, DUR, draw);
      window.__timelines["s2"] = tl;
    })();
  </script>
</template>
