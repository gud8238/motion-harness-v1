<template>
  <style>
    @font-face { font-family: "Pretendard"; src: url("assets/fonts/PretendardVariable.woff2") format("woff2"); font-weight: 45 920; font-display: block; }
    #s3 { position: absolute; inset: 0; }
    #s3-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #s3-cap { position: absolute; left: 96px; top: 150px; font: 700 64px "Pretendard", sans-serif; color: var(--ink); }
  </style>
  <div id="s3" data-composition-id="s3" data-width="1920" data-height="1080">
    <canvas id="s3-cv" width="1920" height="1080"></canvas>
    <div id="s3-cap">어느 쪽에서 봐도, 같은 규칙</div>
  </div>
  <script>
    (function () {
      const D = window.DNA, DUR = 4, T = MH3.THREE;
      const s = MH3.stage("s3-cv", { bg: D.bg, fov: 30 });
      MH3.lights(s.scene);
      MH3.contactShadow(s.scene, { r: 1.1, opacity: 0.3 });
      let tt = null;
      function draw(t) {
        if (tt) tt.set(MH.kf(t, [[0, 0], [1.6, 45, MH.E.snap], [3.2, 90, MH.E.snap]]));
        MH3.orbit(s.camera, { target: [0, 1.1, 0], radius: 7.5 - 1.2 * MH.E.inOut(t / DUR), height: 0.3, angle: -8 + 16 * (t / DUR) });
        s.render();
      }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s3-cap", { yPercent: 60, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.5, ease: "dna" }, 0.3);
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["s3-images"] = MH.load({
        front: { src: "assets/source/robot-front.jpg", cutout: true, tol: 14 },
        tq: { src: "assets/source/robot-three-quarter.jpg", cutout: true, tol: 14 },
        side: { src: "assets/source/robot-side.jpg", cutout: true, tol: 14 },
      }).then((IMG) => {
        tt = MH3.turntable([{ img: IMG.front, angle: 0 }, { img: IMG.tq, angle: 45 }, { img: IMG.side, angle: 90 }], { h: 2.3 });
        s.scene.add(tt.group); draw(tl.time());
      });
      MH.drive(tl, DUR, draw);
      window.__timelines["s3"] = tl;
    })();
  </script>
</template>
